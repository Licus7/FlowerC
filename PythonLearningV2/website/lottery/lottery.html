<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精灵抽奖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="l.css">
    <style>
        /* 添加一些基础样式确保图片显示 */
        .pet-image-container img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
        .new-pet img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        .pet-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 返回按钮 -->
        <a href="../menu.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回
        </a>
        
        <!-- coin显示 -->
        <div class="coin-display">
            <i class="fas fa-coins"></i>
            <span id="currentCoins">0</span>
        </div>
        
        <div class="lottery-container">
            <h1><i class="fas fa-star"></i> 精灵抽奖</h1>
            <p class="subtitle">消耗50coin抽取随机精灵</p>
            
            <!-- 抽奖区域 -->
            <div class="lottery-main">
                <div class="pet-image-container">
                    <!-- 修改为本地图片路径 -->
                    <img id="currentPetImage" src="../pokemon_gifs/25.gif" alt="皮卡丘">
                </div>
                
                <button id="drawButton" class="draw-btn" onclick="drawLottery()">
                    <i class="fas fa-star"></i> 抽取精灵！<br>
                    <small>(花费50coin)</small>
                </button>
            </div>
            
            <!-- 抽奖结果 -->
            <div id="resultContainer" class="result-container" style="display: none;">
                <h3>恭喜获得新精灵！</h3>
                <div class="new-pet">
                    <img id="newPetImage" src="" alt="新精灵">
                    <div class="pet-info">
                        <h4 id="newPetName"></h4>
                        <div id="newPetRarity" class="new-pet-rarity"></div>
                        <p id="newPetDescription"></p>
                    </div>
                </div>
                <button class="close-btn" onclick="closeResult()">关闭</button>
            </div>
            
            <!-- 我的精灵收藏 -->
            <div class="collection-section">
                <h3><i class="fas fa-heart"></i> 我的精灵收藏</h3>
                <div id="myPetsGrid" class="pet-grid">
                    <!-- 精灵会动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 调试按钮 -->
    <button onclick="debugLottery()" style="
        position: fixed;
        bottom: 20px;
        left: 20px;
        padding: 10px 15px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        z-index: 10000;
        font-size: 12px;
    ">
        🐛 调试
    </button>

    <!-- 引入正确的脚本 -->
    <script src="lottery.js"></script>
    <script src="l.js"></script>
    
    <script>
    // 调试函数
    function debugLottery() {
        console.log('=== 抽奖系统调试 ===');
        
        // 检查关键元素
        const elements = {
            currentPetImage: document.getElementById('currentPetImage'),
            newPetImage: document.getElementById('newPetImage'),
            resultContainer: document.getElementById('resultContainer')
        };
        
        console.log('元素状态:', elements);
        
        // 测试图片加载
        console.log('测试图片加载:');
        const testImg = new Image();
        testImg.onload = () => console.log('✅ 本地图片能加载');
        testImg.onerror = () => console.log('❌ 本地图片加载失败');
        testImg.src = '../pokemon_gifs/25.gif';
        
        // 检查文件夹内容
        console.log('图片文件夹应该包含: 1.gif, 4.gif, 7.gif, 25.gif 等');
        
        alert('请查看控制台 (F12 → Console)');
    }
    
    // 检查图片是否存在
    function checkImageExists(url, callback) {
        const img = new Image();
        img.onload = function() {
            callback(true);
        };
        img.onerror = function() {
            callback(false);
        };
        img.src = url;
    }
    
    // 页面加载时检查
    window.addEventListener('load', function() {
        console.log('页面加载完成，检查图片...');
        
        // 检查默认图片
        checkImageExists('../pokemon_gifs/25.gif', function(exists) {
            if (!exists) {
                console.error('❌ ../pokemon_gifs/25.gif 不存在！');
                console.log('请确保:');
                console.log('1. pokemon_gifs 文件夹存在');
                console.log('2. 文件夹内有 25.gif 文件');
                console.log('3. 文件夹在正确位置（与 lottery.html 同目录）');
                
                // 尝试列出文件夹内容
                fetch('../pokemon_gifs/')
                    .then(response => console.log('文件夹状态:', response.status))
                    .catch(err => console.log('无法访问文件夹:', err));
            } else {
                console.log('✅ 图片存在，可以正常显示');
            }
        });
    });
    </script>
</body>
</html>
